# À ajouter dans le <VirtualHost *:443> de ve2cuy.com (ve2cuy.com-le-ssl.conf), avant
# </VirtualHost>. Exige : sudo a2enmod proxy proxy_wstunnel
#
# La page ouvre wss://ve2cuy.com/trs80/relay?host=...&port=... ; Apache transmet au relais
# local (127.0.0.1:8023), avec l'adresse du client dans X-Forwarded-For.
ProxyPass        /trs80/relay ws://127.0.0.1:8023/
ProxyPassReverse /trs80/relay ws://127.0.0.1:8023/
